version: '3.8'

services:
  privacy-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privacy-dashboard
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: on-failure
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
